# Only the dedicated cloudflared connector can assert visitor identity.
# realip_remote_addr retains the transport peer after real_ip rewrites remote_addr.
map $realip_remote_addr $atlas_https {
    default off;
    172.30.88.3 on;
}
map $atlas_https $atlas_scheme {
    default http;
    on https;
}
map $atlas_https $atlas_port {
    default 8080;
    on 443;
}

server {
    listen 8080;
    server_name dashboard.stolner.com localhost;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript font/ttf;
    set_real_ip_from 172.30.88.3;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exact match: PHP source is never returned by the static file handler.
    location = /index.php {
        # Explicit params avoid duplicate HTTPS / scheme / port definitions.
        include /etc/nginx/atlas-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. { deny all; }
    location ~* \.php(?:/|$) { return 404; }

    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
